# =============================================================================
# DCM Configuration - Stage 2: Aggressive Rules & Tight Metrics
# =============================================================================
# Documentation: https://dcm.dev/docs/configuration
# =============================================================================

dcm:
  # ---------------------------------------------------------------------------
  # Metrics Thresholds (tightened from Stage 1 baselines)
  # ---------------------------------------------------------------------------

  metrics:
    cyclomatic-complexity:
      threshold: 10

    lines-of-code:
      threshold: 50

    number-of-parameters:
      threshold: 6

    maximum-nesting-level:
      threshold: 4

    number-of-methods:
      threshold: 15

    weight-of-a-class:
      threshold: 15.0

  # ---------------------------------------------------------------------------
  # Exclusions
  # ---------------------------------------------------------------------------

  exclude:
    metrics:
      - "**/*.g.dart"
      - "**/*.freezed.dart"
      - "build/**"
      - "native/**"
      - "test/**"
    rules:
      - "**/*.g.dart"
      - "**/*.freezed.dart"

  # ---------------------------------------------------------------------------
  # Rules
  # ---------------------------------------------------------------------------

  rules:
    # --- Bug Prevention ---
    - avoid-throw-in-finally-block

    # --- Common Anti-Patterns ---
    - avoid-unused-parameters
    - avoid-nested-conditional-expressions
    - avoid-missing-enum-constant-in-map
    - avoid-unnecessary-type-assertions
    - avoid-unnecessary-type-casts
    - avoid-unrelated-type-assertions
    - avoid-redundant-async
    - avoid-duplicate-exports
    - avoid-collection-methods-with-unrelated-types
    - avoid-passing-async-when-sync-expected

    # --- Style & Formatting ---
    - prefer-match-file-name:
        exclude:
          - "test/**"
          - "lib/**/native_bindings.dart"
          - "lib/**/wasm_bindings.dart"
          # Part files — first type is a sealed subclass, not the file name
          - "lib/src/platform/monty_value_scalars.dart"
          - "lib/src/platform/monty_value_collections.dart"
          - "lib/src/platform/monty_value_datetime.dart"
          - "lib/src/platform/monty_value_structured.dart"
          # Files with helper types/enums before the main class
          - "lib/src/platform/core_bindings.dart"
          - "lib/src/bridge/bridge/bridge_middleware.dart"
          - "lib/src/bridge/bridge/event_loop_bridge.dart"
          - "lib/src/bridge/bridge/monty_plugin.dart"
          - "lib/src/bridge/plugins/sandbox_plugin.dart"
          - "lib/src/bridge/plugins/template_plugin.dart"
          - "lib/src/bridge/plugins/message_bus_plugin.dart"
          - "lib/src/wasm/wasm_bindings_js_stub.dart"
    - prefer-immediate-return
    - prefer-commenting-analyzer-ignores
    - prefer-conditional-expressions
    - prefer-trailing-comma
    - prefer-moving-to-variable
    - newline-before-return
    - no-boolean-literal-compare
    - no-empty-block:
        exclude:
          # Intentionally empty: null-object pattern and default no-ops
          - "lib/src/platform/bridge_logger.dart"
          - "lib/src/bridge/bridge/monty_plugin.dart"
          - "lib/src/bridge/bridge/monty_bridge.dart"
          - "lib/src/bridge/bridge/default_monty_bridge.dart"
    - no-equal-then-else
    - prefer-first
    - prefer-last
    - binary-expression-operand-order
    - double-literal-format

    # --- Immutability ---
    - prefer-final-fields

    # --- Null Safety & Types ---
    - avoid-late-keyword:
        exclude:
          - "test/**"
    # fromJson factories and JSON boundary code use Map<String, dynamic>
    # per Dart convention. Exclude only the specific files that need it.
    - avoid-dynamic:
        exclude:
          - "test/**"
          - "lib/src/platform/monty_value.dart"
          - "lib/src/platform/monty_value_collections.dart"
          - "lib/src/platform/monty_value_structured.dart"
          - "lib/src/platform/base_monty_platform.dart"
          - "lib/src/platform/core_bindings.dart"
          - "lib/src/platform/monty_progress.dart"
          - "lib/src/platform/monty_exception.dart"
    # FFI/isolate boundary and bridge dispatch code has protocol-guaranteed
    # non-null values that the type system cannot express.
    - avoid-non-null-assertion:
        exclude:
          - "test/**"
          - "**/example/**"
          - "lib/src/ffi/native_isolate_bindings_impl.dart"
          - "lib/src/platform/base_monty_platform.dart"
          - "lib/src/platform/monty_progress.dart"
          - "lib/src/platform/monty_session.dart"
          - "lib/src/bridge/bridge/default_monty_bridge.dart"
          - "lib/src/bridge/bridge/host_param.dart"
          - "lib/src/bridge/bridge/plugin_registry.dart"
          - "lib/src/bridge/plugins/sandbox_plugin.dart"
          - "lib/src/bridge/os_call/default_os_call_handler_native.dart"
          - "lib/src/wasm/wasm_bindings_js.dart"
          - "lib/src/wasm/wasm_core_bindings.dart"

    # --- Architecture Safety ---
    - avoid-banned-imports:
        entries:
          - paths: ["lib/"]
            deny:
              - "package:flutter/material.dart"
              - "package:flutter/widgets.dart"
              - "package:flutter/cupertino.dart"
              - "package:dart_monty_native/dart_monty_native.dart"
              - "package:dart_monty_web/dart_monty_web.dart"
            message: "This is a pure Dart package. Do not import Flutter or removed shim packages."
    - avoid-global-state

    # --- Member Ordering ---
    - member-ordering:
        order:
          - constructors
          - public-fields
          - private-fields
          - get-setters
          - public-methods
          - private-methods
          - overridden-methods

    # --- Testing ---
    - prefer-test-matcher
    - prefer-correct-test-file-name:
        exclude:
          - "**/python_ladder_runner.dart"
