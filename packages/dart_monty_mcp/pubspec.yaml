name: dart_monty_mcp
description: MCP server exposing the Monty Python interpreter as tools.
version: 0.1.1
publish_to: none
repository: https://github.com/runyaga/dart_monty

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  dart_monty_bridge:
    path: ../dart_monty_bridge
  dart_monty_ffi:
    path: ../dart_monty_ffi
  dart_monty_platform_interface:
    path: ../dart_monty_platform_interface
  mcp_dart: ^2.1.0

dev_dependencies:
  test: ^1.25.0
  very_good_analysis: ^10.0.0

dependency_overrides:
  dart_monty_bridge:
    path: ../dart_monty_bridge
  dart_monty_ffi:
    path: ../dart_monty_ffi
  dart_monty_platform_interface:
    path: ../dart_monty_platform_interface
