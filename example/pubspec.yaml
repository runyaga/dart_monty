name: dart_monty_examples
description: Examples for dart_monty.
publish_to: none

environment:
  sdk: ^3.10.0

dependencies:
  dart_monty:
    path: ../

dev_dependencies:
  dart_monty_core: ^0.110.0-dev.4
  very_good_analysis: ^10.0.0

# Same pin as ../pubspec.yaml, which see.
#
# `dependency_overrides` do not propagate from the parent package, and
# dart_monty_core 0.110.0-dev.4 is not on pub.dev, so the constraint above
# cannot resolve without this block.
#
# Delete this block when ../pubspec.yaml's override goes.
dependency_overrides:
  dart_monty_core:
    git:
      url: https://github.com/runyaga/dart_monty_core.git
      # Core branch 0.120 pin (not a release).
      ref: 29d1f4ae9ebaab15c4f4a3b90a1750ae5a34b8dc
