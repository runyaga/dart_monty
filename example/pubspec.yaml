name: dart_monty_examples
description: Examples for dart_monty.
publish_to: none

environment:
  sdk: ^3.10.0

dependencies:
  dart_monty:
    path: ../

dev_dependencies:
  dart_monty_core: ^0.110.0-dev.2
  very_good_analysis: ^10.0.0

# Same pin as ../pubspec.yaml, which see.
#
# `dependency_overrides` do not propagate from the parent package, so without
# this block the examples resolve dart_monty_core from pub.dev while the root
# package uses the pinned commit. That mismatch once made `example_smoke_test`
# run dataclass_demo against an older core and fail with `MontyNone`.
#
# Delete this block when ../pubspec.yaml's override goes.
dependency_overrides:
  dart_monty_core:
    git:
      url: https://github.com/runyaga/dart_monty_core.git
      ref: 7c554161bdb07bd8526e399086505805983b3372
