name: web_example
description: Run Python from Dart in the browser via WASM.
publish_to: none

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  dart_monty:
    path: ../..
  dart_monty_core: ^0.110.0-dev.4
  web: ^1.1.1

# `dependency_overrides` do not propagate from a path dependency, and
# dart_monty_core 0.110.0-dev.4 is not on pub.dev, so the constraint above
# cannot resolve without this block.
#
# Must name the same ref as pubspec.yaml, example/pubspec.yaml,
# example/native/pubspec.yaml and pages.yaml; tool/check_core_ref.sh fails the gate if they disagree.
dependency_overrides:
  dart_monty_core:
    git:
      url: https://github.com/runyaga/dart_monty_core.git
      # Core branch 0.120 pin (not a release).
      ref: bcfbc232ece6436c3e68ec7edfca7c1cad6a32be
