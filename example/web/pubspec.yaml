name: web_example
description: Run Python from Dart in the browser via WASM.
publish_to: none

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  dart_monty:
    path: ../..
  dart_monty_core: ^0.110.0-dev.2
  web: ^1.1.1

# `dependency_overrides` do not propagate from a path dependency, so without this
# block dart_monty_core resolves from pub.dev while the package under test uses
# the pinned commit. Compiling the web demos against a published core would
# prove nothing about the pinned one.
#
# Must name the same ref as pubspec.yaml, example/pubspec.yaml and
# pages.yaml; tool/check_core_ref.sh fails the gate if they disagree.
dependency_overrides:
  dart_monty_core:
    git:
      url: https://github.com/runyaga/dart_monty_core.git
      ref: 7c554161bdb07bd8526e399086505805983b3372
