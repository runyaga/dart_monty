<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>dart_monty Reactive UI Demo</title>
  <style>
    :root {
      --bg: #1a1b26;
      --surface: #24283b;
      --surface2: #2f3447;
      --border: #4e5579;
      --text: #c0caf5;
      --text-dim: #7982a9;
      --accent: #7aa2f7;
      --green: #9ece6a;
      --yellow: #e0af68;
      --red: #f7768e;
      --orange: #ff9e64;
      --cyan: #7dcfff;
      --purple: #bb9af7;
      --mono: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      padding: 12px 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 16px;
    }

    header h1 {
      font-size: 16px;
      font-weight: 600;
      color: var(--accent);
    }

    header .tag {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 500;
    }

    .tag-agent { background: #3d2d5e; color: var(--purple); }
    .tag-wasm { background: #2d3a5e; color: var(--cyan); }
    .tag-stateful { background: #2d3e2d; color: var(--green); }

    #status {
      margin-left: auto;
      font-size: 12px;
      color: var(--text-dim);
    }

    #status.ready { color: var(--green); }
    #status.running { color: var(--yellow); }
    #status.error { color: var(--red); }

    .main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 1px;
      background: var(--border);
      overflow: hidden;
    }

    .panel {
      background: var(--surface);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .panel-header {
      padding: 8px 12px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-dim);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .panel-body {
      flex: 1;
      overflow: auto;
      padding: 0;
    }

    /* Code editor */
    #editor {
      width: 100%;
      height: 100%;
      background: transparent;
      color: var(--text);
      border: none;
      resize: none;
      padding: 12px;
      font-family: var(--mono);
      font-size: 13px;
      line-height: 1.6;
      outline: none;
      tab-size: 4;
    }

    .editor-panel .panel-header {
      display: flex;
      justify-content: space-between;
    }

    .btn-group { display: flex; gap: 6px; }

    .btn {
      padding: 4px 12px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--surface2);
      color: var(--text);
      font-size: 11px;
      cursor: pointer;
      font-family: inherit;
    }

    .btn:hover { border-color: var(--accent); }

    .btn-run {
      background: #1a3a1a;
      border-color: var(--green);
      color: var(--green);
      font-weight: 600;
    }

    .btn-run:hover { background: #2a4a2a; }
    .btn-run:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Result & Output panels */
    #output, #app-canvas {
      padding: 12px;
      font-family: var(--mono);
      font-size: 13px;
      white-space: pre-wrap;
      word-break: break-all;
    }

    /* UI Canvas specific styles */
    #app-canvas {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 20px;
    }
    
    .btn-ui {
      background: var(--accent);
      color: #000;
      font-size: 13px;
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      font-weight: 500;
    }
    
    .btn-ui:hover {
      background: #8ab0f8;
    }
    
    .ui-input {
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--bg);
      color: var(--text);
      font-family: inherit;
    }

  </style>
</head>
<body>

  <header>
    <h1>dart_monty</h1>
    <span class="tag tag-agent">Reactive SDUI</span>
    <span class="tag tag-wasm">WASM</span>
    <span class="tag tag-stateful">Daemon Mode</span>
    <span id="status">Loading WASM...</span>
  </header>

  <div class="main">
    <div class="panel editor-panel" style="grid-row: 1 / 3;">
      <div class="panel-header">
        <span>Python Script</span>
        <div class="btn-group">
          <select id="demo-select" class="btn" style="padding: 2px 8px;">
            <option value="counter">Demo 1: Reactive Counter</option>
            <option value="wizard">Demo 2: Form Wizard</option>
            <option value="agent">Demo 3: LLM Fetch Agent</option>
          </select>
          <button id="run-btn" class="btn btn-run" disabled>Run</button>
        </div>
      </div>
      <div class="panel-body">
        <textarea id="editor" spellcheck="false"></textarea>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header">App Canvas (Rendered by Python)</div>
      <div class="panel-body" id="app-canvas">
      </div>
    </div>

    <div class="panel">
      <div class="panel-header">Output</div>
      <div class="panel-body" id="output"></div>
    </div>
  </div>

  <!-- Service Worker for SharedArrayBuffer / WASM support -->
  <script src="coi-serviceworker.js"></script>

  <script>
    const demos = {
      'counter': `ui_render({
    "type": "col",
    "children": [
        {"type": "text", "id": "counter_lbl", "value": "Clicks: 0"},
        {"type": "button", "id": "btn_add", "label": "Add 1", "action": "click"}
    ]
})

clicks = 0
while True:
    event = ui_wait_for_event()
    if event['action'] == 'click' and event['id'] == 'btn_add':
        clicks += 1
        ui_set_state('counter_lbl', 'value', f"Clicks: {clicks}")`,
        
      'wizard': `def render_step(step_num, error=""):
    tree = {"type": "col", "children": [{"type": "text", "value": f"Step {step_num} of 3"}]}
    if error:
        tree['children'].append({"type": "text", "value": error, "color": "#f7768e"})
        
    if step_num == 1:
        tree['children'].extend([
            {"type": "input", "id": "name_input", "placeholder": "Enter your name"},
            {"type": "button", "id": "btn_next", "label": "Next", "action": "click"}
        ])
    elif step_num == 2:
        tree['children'].extend([
            {"type": "text", "value": "Validating..."},
            {"type": "button", "id": "btn_next", "label": "Finish", "action": "click"}
        ])
    elif step_num == 3:
        tree['children'].append({"type": "text", "value": "Done!", "color": "#9ece6a"})
        
    ui_render(tree)

state = {'step': 1, 'data': {}}
render_step(state['step'])

while True:
    event = ui_wait_for_event()
    if event['action'] == 'click' and event['id'] == 'btn_next':
        if state['step'] == 1:
            name = event['payload'].get('name_input', '')
            if len(name) < 3:
                render_step(state['step'], error="Name must be at least 3 chars.")
            else:
                state['data']['name'] = name
                state['step'] += 1
                render_step(state['step'])
        elif state['step'] == 2:
            state['step'] += 1
            render_step(state['step'])`,
            
      'agent': `ui_render({
    "type": "col",
    "children": [
        {"type": "input", "id": "query_input", "placeholder": "Ask the agent..."},
        {"type": "button", "id": "btn_ask", "label": "Ask", "action": "click"},
        {"type": "text", "id": "status_lbl", "value": "", "color": "#7982a9"},
        {"type": "text", "id": "result_lbl", "value": ""}
    ]
})

while True:
    event = ui_wait_for_event()
    if event['id'] == 'btn_ask':
        query = event['payload'].get('query_input', '')
        
        ui_set_state('status_lbl', 'value', 'Status: Fetching tools...')
        ui_set_state('btn_ask', 'disabled', True)
        
        # Async host function simulated fetch
        result = http_get(query) 
        
        ui_set_state('status_lbl', 'value', 'Status: Idle')
        ui_set_state('result_lbl', 'value', f"Answer: {result}")
        ui_set_state('btn_ask', 'disabled', False)`
    };

    const statusEl = document.getElementById('status');
    const runBtn = document.getElementById('run-btn');
    const outputEl = document.getElementById('output');
    const editorEl = document.getElementById('editor');
    const demoSelect = document.getElementById('demo-select');

    editorEl.value = demos['counter'];
    
    demoSelect.addEventListener('change', (e) => {
      editorEl.value = demos[e.target.value];
    });

    window._onReady = async () => {
      statusEl.textContent = 'Initializing...';
      const initStr = await window.ReactiveDemo.init();
      const initResult = JSON.parse(initStr);
      
      if (initResult.ok) {
        statusEl.textContent = 'Ready';
        statusEl.className = 'ready';
        runBtn.disabled = false;
      } else {
        statusEl.textContent = 'Init Failed: ' + initResult.error;
        statusEl.className = 'error';
      }
    };

    runBtn.addEventListener('click', async () => {
      console.log('[ReactiveDemo UI] Run button clicked');
      runBtn.disabled = true;
      statusEl.textContent = 'Running...';
      statusEl.className = 'running';
      outputEl.textContent = '';
      document.getElementById('app-canvas').innerHTML = '';

      const code = editorEl.value;
      console.log('[ReactiveDemo UI] Sending code to Dart backend...');
      const resultStr = await window.ReactiveDemo.run(code);
      console.log('[ReactiveDemo UI] Received result string:', resultStr);
      const result = JSON.parse(resultStr);

      statusEl.textContent = 'Ready';
      statusEl.className = 'ready';
      runBtn.disabled = false;

      if (result.ok) {
        console.log('[ReactiveDemo UI] Execution succeeded');
        outputEl.textContent = "Finished.\n" + (result.print_output || '');
      } else {
        console.error('[ReactiveDemo UI] Execution failed', result);
        outputEl.textContent = result.error + '\n\n' + (result.print_output || '');
      }
    });

  </script>

  <!-- Load compiled Dart code -->
  <script src="dart_monty_bridge.js"></script>
  <script src="reactive_demo.dart.js"></script>

</body>
</html>
