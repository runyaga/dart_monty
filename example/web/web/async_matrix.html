<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>dart_monty — Async/Sync Matrix Demo</title>

<link rel="stylesheet" href="site.css"><script defer src="site.js"></script></head>
<body data-page="async_matrix"><div id="site-nav"></div>
  <header>
    <a href="index.html">&larr; Home</a>
    <h1>Async/Sync Matrix Demo</h1>
    <span class="version-badge" style="color:#565f89;font-size:12px;margin-left:10px;white-space:nowrap;"></span>
    <span class="tag">WASM</span>
    <span class="tag">useFutures</span>
  </header>
  <main id="output">Loading WASM...</main>
  <script>
    const out = document.getElementById('output');
    out.textContent = '';
    const origLog = console.log.bind(console);
    console.log = (...args) => {
      origLog(...args);
      out.textContent += args.join(' ') + '\n';
    };
  </script>
  <script src="coi-serviceworker.js"></script>
  <script src="async_matrix_demo.dart.js"></script>
<section><h2>Exact expected values</h2><pre id="expected-values"></pre></section><script>
fetch('examples.json').then(r => r.json()).then(all => {
 document.getElementById('expected-values').textContent = all.filter(e => e.pages.includes('async_matrix')).map(e => e.id + ': ' + (e.error || JSON.stringify(e.expected))).join('\n');
});
window.__montyCheckControls = async () => {
 if (!document.getElementById('output').textContent.includes('EXAMPLE_DONE')) throw Error('Matrix incomplete');
 return true;
};
</script></body>
</html>
