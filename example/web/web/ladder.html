<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>dart_monty — Python Ladder Showcase</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
      background: #1a1b26;
      color: #c0caf5;
      padding: 2rem;
      max-width: 960px;
      margin: 0 auto;
    }
    a { color: #7aa2f7; }
    h1 {
      color: #7aa2f7;
      margin-bottom: 0.5rem;
      font-size: 1.4rem;
    }
    .subtitle {
      color: #565f89;
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
    }
    .nav { margin-bottom: 1.5rem; }
    .nav a { margin-right: 1rem; font-size: 0.85rem; }

    /* Status bar */
    #status {
      background: #24283b;
      border: 1px solid #3b4261;
      border-radius: 4px;
      padding: 0.75rem 1rem;
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
    }
    #status.init { border-left: 3px solid #7aa2f7; }
    #status.running { border-left: 3px solid #e0af68; }
    #status.done { border-left: 3px solid #9ece6a; }
    #status.error { border-left: 3px solid #f7768e; }

    /* Totals */
    #totals {
      display: none;
      background: #24283b;
      border: 1px solid #3b4261;
      border-radius: 4px;
      padding: 0.75rem 1rem;
      margin-bottom: 1.5rem;
    }
    .progress-bar {
      background: #3b4261;
      border-radius: 3px;
      height: 8px;
      margin-top: 0.5rem;
      overflow: hidden;
    }
    .progress-fill {
      background: #9ece6a;
      height: 100%;
      transition: width 0.3s;
    }

    /* Legend */
    .legend {
      display: none;
      background: #24283b;
      border: 1px solid #333;
      border-radius: 4px;
      padding: 0.75rem 1rem;
      margin-bottom: 1.5rem;
      font-size: 0.8rem;
      line-height: 1.6;
    }
    .legend-item { display: inline-block; margin-right: 1.5rem; }
    .legend-dot {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      margin-right: 0.3rem;
      vertical-align: middle;
    }
    .legend-dot.pass { background: #9ece6a; }
    .legend-dot.warn { background: #e0af68; }
    .legend-dot.fail { background: #f7768e; }
    .legend-dot.skip { background: #565f89; }
    .legend-dot.xfail { background: #9b59b6; }
    .legend-dot.xpass { background: #8e44ad; }

    /* Tier sections */
    .tier { margin-bottom: 1.5rem; }
    .tier-header {
      color: #e0af68;
      font-size: 1rem;
      padding: 0.5rem 0;
      border-bottom: 1px solid #3b4261;
      margin-bottom: 0.5rem;
      cursor: pointer;
      user-select: none;
    }
    .tier-header:hover { color: #e5c07b; }
    .tier-header::before { content: '\25BC '; font-size: 0.7rem; }
    .tier-header.collapsed::before { content: '\25B6 '; }
    .tier-body.hidden { display: none; }

    /* Test cards */
    .test-card {
      background: #24283b;
      border: 1px solid #333;
      border-radius: 4px;
      margin-bottom: 0.5rem;
      overflow: hidden;
    }
    .test-card.pass { border-left: 3px solid #9ece6a; }
    .test-card.warn { border-left: 3px solid #e0af68; }
    .test-card.fail { border-left: 3px solid #f7768e; }
    .test-card.skip { border-left: 3px solid #565f89; }
    .test-card.xfail { border-left: 3px solid #9b59b6; }
    .test-card.xpass { border-left: 3px solid #8e44ad; }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.4rem 0.75rem;
      cursor: pointer;
      user-select: none;
    }
    .card-header:hover { background: #2a2d2e; }
    .test-name { font-size: 0.85rem; }
    .badge {
      font-size: 0.7rem;
      padding: 0.15rem 0.5rem;
      border-radius: 3px;
      font-weight: bold;
      text-transform: uppercase;
    }
    .badge.pass { background: #9ece6a; color: #1a1b26; }
    .badge.warn { background: #e0af68; color: #1a1b26; }
    .badge.fail { background: #f7768e; color: #1a1b26; }
    .badge.skip { background: #565f89; color: #1a1b26; }
    .badge.xfail { background: #9b59b6; color: #1a1b26; }
    .badge.xpass { background: #8e44ad; color: #1a1b26; }

    .card-body {
      display: none;
      padding: 0.5rem 0.75rem;
      border-top: 1px solid #333;
    }
    .card-body.open { display: block; }

    .card-body label {
      display: block;
      color: #565f89;
      font-size: 0.75rem;
      margin-top: 0.4rem;
      margin-bottom: 0.2rem;
    }
    .card-body pre {
      background: #1a1b26;
      padding: 0.5rem;
      border-radius: 3px;
      font-size: 0.8rem;
      overflow-x: auto;
      white-space: pre-wrap;
      line-height: 1.4;
    }
    .code-block { color: #ce9178; }
    .result-block { color: #b5cea8; }
    .warn-block { color: #e0af68; }
    .error-block { color: #f7768e; }
  </style>
</head>
<body>
  <div style="padding:12px 20px;background:#24283b;border-bottom:1px solid #3b4261;display:flex;align-items:center;gap:16px;">
    <a href="index.html" style="color:#565f89;text-decoration:none;font-size:13px;">&larr; Home</a>
    <span style="font-size:16px;font-weight:600;color:#7aa2f7;">Python Ladder</span>
    <span style="font-size:11px;padding:2px 8px;border-radius:4px;background:#2d3a5e;color:#7dcfff;">WASM</span>
  </div>

  <div id="status" class="init">Initializing WASM Worker...</div>
  <div id="legend" class="legend"></div>
  <div id="totals"></div>
  <div id="tiers"></div>

  <script>
    const tiersEl = document.getElementById('tiers');
    const statusEl = document.getElementById('status');
    const totalsEl = document.getElementById('totals');
    const legendEl = document.getElementById('legend');
    let currentTierBody = null;

    function reportInit(ok, message) {
      if (ok) {
        statusEl.className = 'running';
        statusEl.textContent = 'Running fixtures...';
      } else {
        statusEl.className = 'error';
        statusEl.textContent = 'Init failed: ' + message;
      }
    }

    function reportTierHeader(label) {
      const tier = document.createElement('div');
      tier.className = 'tier';
      const header = document.createElement('div');
      header.className = 'tier-header';
      header.textContent = label;
      const body = document.createElement('div');
      body.className = 'tier-body';
      header.addEventListener('click', () => {
        header.classList.toggle('collapsed');
        body.classList.toggle('hidden');
      });
      tier.appendChild(header);
      tier.appendChild(body);
      tiersEl.appendChild(tier);
      currentTierBody = body;
    }

    // Tier-number → fixture-filename mapping. Kept in sync with
    // bin/ladder_showcase.dart's _tierFiles so headless harnesses
    // (tool/test_python_ladder.sh) can match against
    // test/fixtures/python_ladder/known_failures.txt.
    const TIER_FILES = {
      1: 'tier_01_expressions.json',
      2: 'tier_02_variables.json',
      3: 'tier_03_control_flow.json',
      4: 'tier_04_functions.json',
      5: 'tier_05_errors.json',
      6: 'tier_06_external_fns.json',
      7: 'tier_07_advanced.json',
      8: 'tier_08_kwargs.json',
      9: 'tier_09_exceptions.json',
      10: 'tier_10_math_module.json',
      11: 'tier_11_re_module.json',
      12: 'tier_12_monty_008_features.json',
      13: 'tier_13_async.json',
      15: 'tier_15_script_name.json',
      16: 'tier_16_memory_growth.json',
      17: 'tier_17_json_module.json',
      18: 'tier_18_datetime_module.json',
      19: 'tier_19_lifecycle_errors.json',
    };

    function reportResult(tier, id, name, code, status, detail) {
      // Machine-readable line for headless harnesses. Quote strings
      // through JSON.stringify so embedded quotes / unicode survive.
      const tierFile = TIER_FILES[tier] || ('tier_' + String(tier).padStart(2, '0') + '_unknown.json');
      console.log('LADDER_RESULT:' + JSON.stringify({
        tier: tierFile,
        name: name,
        ok: status === 'pass',
        status: status,
      }));

      const card = document.createElement('div');
      card.className = 'test-card ' + status;

      const header = document.createElement('div');
      header.className = 'card-header';

      const nameSpan = document.createElement('span');
      nameSpan.className = 'test-name';
      nameSpan.textContent = '#' + id + ' ' + name;

      const badge = document.createElement('span');
      badge.className = 'badge ' + status;
      badge.textContent = status;

      header.appendChild(nameSpan);
      header.appendChild(badge);

      const body = document.createElement('div');
      body.className = 'card-body';

      if (code) {
        const codeLabel = document.createElement('label');
        codeLabel.textContent = 'Python code';
        const codePre = document.createElement('pre');
        codePre.className = 'code-block';
        codePre.textContent = code;
        body.appendChild(codeLabel);
        body.appendChild(codePre);
      }

      const resultLabel = document.createElement('label');
      const resultPre = document.createElement('pre');
      if (status === 'pass' || status === 'skip') {
        resultLabel.textContent = 'Result';
        resultPre.className = 'result-block';
      } else if (status === 'xfail') {
        resultLabel.textContent = 'Expected failure (known issue)';
        resultPre.className = 'result-block';
      } else if (status === 'xpass') {
        resultLabel.textContent = 'Unexpected pass (expected failure did not occur)';
        resultPre.className = 'result-block';
      } else if (status === 'warn') {
        resultLabel.textContent = 'Result (WASM behavioral difference)';
        resultPre.className = 'warn-block';
      } else {
        resultLabel.textContent = 'Failure';
        resultPre.className = 'error-block';
      }
      resultPre.textContent = detail;
      body.appendChild(resultLabel);
      body.appendChild(resultPre);

      // Auto-expand warnings and failures
      if (status === 'warn' || status === 'fail') body.classList.add('open');

      header.addEventListener('click', () => body.classList.toggle('open'));

      card.appendChild(header);
      card.appendChild(body);

      if (currentTierBody) currentTierBody.appendChild(card);
    }

    function reportDone(passed, warned, failed, total, skipped, xfailed, xpassed) {
      const pct = total > 0 ? Math.round((passed / total) * 100) : 0;

      statusEl.className = failed > 0 ? 'error' : 'done';
      if (failed > 0) {
        statusEl.textContent = passed + '/' + total + ' passed, ' + failed + ' failed, ' + warned + ' warnings';
      } else if (warned > 0) {
        statusEl.textContent = passed + '/' + total + ' passed, ' + warned + ' WASM differences';
      } else {
        statusEl.textContent = 'All ' + total + ' tests passed!';
      }

      legendEl.style.display = 'block';
      legendEl.innerHTML =
        '<span class="legend-item"><span class="legend-dot pass"></span> Pass — value matches expected</span>' +
        '<span class="legend-item"><span class="legend-dot warn"></span> Warn — bridge OK, value differs (WASM behavioral difference)</span>' +
        '<span class="legend-item"><span class="legend-dot fail"></span> Fail — bridge error or crash</span>' +
        '<span class="legend-item"><span class="legend-dot skip"></span> Skip — native only</span>' +
        '<span class="legend-item"><span class="legend-dot xfail"></span> Xfail — expected failure (known issue)</span>' +
        '<span class="legend-item"><span class="legend-dot xpass"></span> Xpass — unexpected pass</span>';

      totalsEl.style.display = 'block';
      totalsEl.innerHTML =
        '<strong>' + passed + ' passed</strong>' +
        (warned > 0 ? ' &middot; <span style="color:#e0af68">' + warned + ' warnings</span>' : '') +
        (failed > 0 ? ' &middot; <span style="color:#f7768e">' + failed + ' failed</span>' : '') +
        (skipped > 0 ? ' &middot; <span style="color:#565f89">' + skipped + ' skipped</span>' : '') +
        (xfailed > 0 ? ' &middot; <span style="color:#9b59b6">' + xfailed + ' xfail</span>' : '') +
        (xpassed > 0 ? ' &middot; <span style="color:#8e44ad">' + xpassed + ' xpass</span>' : '') +
        ' &middot; ' + total + ' total' +
        '<div class="progress-bar"><div class="progress-fill" style="width:' + pct + '%"></div></div>';
    }
  </script>
  <script src="coi-serviceworker.js"></script>
  <script src="dart_monty_core_bridge.js"></script>
  <script src="ladder_showcase.dart.js"></script>
</body>
</html>
