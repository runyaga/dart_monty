name: native_example
description: Run Python from Dart via the native FFI backend.
publish_to: none

environment:
  sdk: ^3.10.0

dependencies:
  dart_monty:
    path: ../..
  dart_monty_core: ^0.110.0-dev.2

# Without this block dart_monty_core resolves from pub.dev, because
# `dependency_overrides` do not propagate from the parent package into a
# sub-package with its own pubspec. That once pulled an old core against a newer
# dart_monty and failed to compile in platform.dart. No CI job builds this
# package, so a stale pin here is only caught by tool/check_core_ref.sh.
#
# MUST MATCH the ref in pubspec.yaml, example/pubspec.yaml,
# example/web/pubspec.yaml and .github/workflows/pages.yaml.
dependency_overrides:
  dart_monty_core:
    git:
      url: https://github.com/runyaga/dart_monty_core.git
      ref: 7c554161bdb07bd8526e399086505805983b3372
