name: native_example
description: Run Python from Dart via the native FFI backend.
publish_to: none

environment:
  sdk: ^3.10.0

dependencies:
  dart_monty:
    path: ../..

# `dependency_overrides` do not propagate from the parent package into a
# sub-package with its own pubspec, and dart_monty_core 0.110.0-dev.3 is not on
# pub.dev, so dart_monty's own constraint cannot resolve without this block.
#
# MUST MATCH the ref in pubspec.yaml, example/pubspec.yaml,
# example/web/pubspec.yaml and .github/workflows/pages.yaml.
dependency_overrides:
  dart_monty_core:
    git:
      url: https://github.com/runyaga/dart_monty_core.git
      ref: d3bb80fc3bfb05d5f6707174f1cae3970671f69f
