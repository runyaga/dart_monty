name: Publish bridge

on:
  push:
    tags:
      - 'bridge-v[0-9]*.[0-9]*.[0-9]*'

jobs:
  publish:
    uses: ./.github/workflows/_publish-dart-package.yaml
    permissions:
      id-token: write
    with:
      package-name: dart_monty_bridge
      tag-prefix: bridge-v
      package-path: packages/dart_monty_bridge
