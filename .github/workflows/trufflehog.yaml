name: TruffleHog Secrets Scan

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: TruffleHog scan
        # PINNED TO A SHA, not @main. Measured 2026-09-16: @main resolved to
        # 4ecb5c6 — thirteen days of UNRELEASED commits past the latest release
        # v3.97.4 (363923b, 2026-09-03). A secret scanner is exactly the action
        # least suitable for tracking someone else's HEAD: it runs on every
        # push, reads the whole repo, and a mutable ref means the code doing
        # that is whatever landed upstream this morning.
        #
        # SHA rather than the tag, because a tag can be moved.
        uses: trufflesecurity/trufflehog@e76dff8a7e57d6df0c60ad8cbf5d5cba505a8fc9 # v3.99.2
        with:
          extra_args: --only-verified

  notify-failure:
    runs-on: ubuntu-latest
    needs: [trufflehog]
    if: failure()
    timeout-minutes: 2
    # Posts to a Slack webhook; the GitHub token is not used.
    permissions: {}
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_NOTIFY_URL }}
    steps:
      - name: Notify Slack on failure
        if: env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@91efab103c0de0a537f72a35f6b8cda0ee76bf0a # v2.1.1
        with:
          payload: |
            {
              "channel": "#dart_monty",
              "username": "dart_monty",
              "text": ":rotating_light: ${{ github.workflow }} failed on ${{ github.head_ref || github.ref_name }}:\n${{ github.event.head_commit.message }}\nhttps://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
              "icon_emoji": ":ghost:"
            }
