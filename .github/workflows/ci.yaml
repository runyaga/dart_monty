name: CI

on:
  # Manual re-run, ANY branch. Without it the only way to make CI evaluate a
  # branch is to open a PR for it — so work that is not ready for review cannot
  # be validated at all, and a branch pushed on its own gets nothing but
  # trufflehog. Measured 2026-09-16: `feat/monty-023` carried a full
  # dart_monty_core 0.23 migration (493 tests passing locally) and had run ZERO
  # ci.yaml jobs, because a push to a non-main branch matches no trigger here.
  #
  # dart_monty_core added this for the same reason and it is what let its
  # integration/0.23 branch be validated without a PR.
  #
  # NOTE: GitHub only offers workflow_dispatch for workflows present on the
  # DEFAULT branch, so this does nothing until it reaches `main`.
  workflow_dispatch:
  push:
    # `integration/**` IS A RELEASE LINE, NOT A TOPIC BRANCH. Measured
    # 2026-09-16: integration/0.23 carried the entire dart_monty_core 0.23
    # migration -- a green local gate, 493 tests -- and had run exactly ONE
    # workflow, TruffleHog, because a push to a non-main branch matched no
    # trigger here. workflow_dispatch could not rescue it either: GitHub only
    # offers dispatch for workflows present on the DEFAULT branch, and main's
    # copy does not declare it. There was no button to press.
    # `d1/core-0.110` is the D1 release line (the dart_monty_core 0.110 port);
    # its stacked PRs merge into it, so a push there must run CI too. D1-Z
    # removes it with the branch.
    branches: [main, 'integration/**', 'd1/core-0.110']
  pull_request:
  # No `branches:` filter — a PR gets CI whatever it targets.
  #
  # This previously read `branches: [main, 'feat/**']`, which silently gave
  # ZERO test jobs to any PR based on another branch. #441 merged having run
  # only `label` and `trufflehog`: its "CLEAN / mergeable" status was not
  # evidence of anything. Stacked PRs are normal here, so enumerating prefixes
  # would just move the gap; not filtering closes it.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only. No job posts checks or comments; a job that needs more grants it
# on itself (tool/check_workflow_tokens.py rejects writes here).
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # docs-zensical — parallel build, NOT a cutover
  # ---------------------------------------------------------------------------
  # Material for MkDocs is EOL 2027-05-05 and MkDocs 2.0 will run neither it nor
  # any plugin (see issue #451). This job builds the docs with BOTH tools on
  # every PR that changes the docs and fails if they disagree, so the migration
  # soaks under real changes before pages.yaml is switched over.
  #
  # It lives in ci.yaml, not pages.yaml: pages.yaml triggers only on push-to-main
  # and workflow_dispatch, so it CANNOT run on a pull request.
  #
  # Every assertion below is on an exit code, not on the job's colour. A green
  # run proves nothing if the comparison step is incapable of failing.
  #
  # PATH-FILTERED to its real inputs (the `docs` output of `changes`): the two
  # builds read docs/, mkdocs.yml and the two pinned requirement files, and
  # nothing else in the tree. Both toolchains are pinned, so with unchanged
  # inputs a rebuild can only reproduce the last result. It used to run on
  # every event, including PRs that touch only lib/ or test/. This workflow
  # file is in the filter too, so an edit to this job still exercises it.
  docs-zensical:
    name: docs · mkdocs vs zensical
    needs: [changes]
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Install both toolchains, pinned
        run: |
          set -euo pipefail
          python -m venv .venv-mk  && .venv-mk/bin/pip  install -q -r requirements-docs.lock
          python -m venv .venv-zen && .venv-zen/bin/pip install -q -r requirements-zensical.txt
          .venv-zen/bin/zensical --version

      - name: Build with both
        run: |
          set -euo pipefail
          .venv-mk/bin/mkdocs build -d out-mk
          # `zensical build` has NO -d flag — it errors with "No such option".
          # The output dir must come from site_dir: in a config passed via -f.
          sed 's|^site_dir:.*||' mkdocs.yml > mkdocs-zen.yml
          echo "site_dir: out-zen" >> mkdocs-zen.yml
          .venv-zen/bin/zensical build -f mkdocs-zen.yml --strict

      - name: HTML path sets must be identical
        run: |
          set -euo pipefail
          # Roots stripped, or the comparison can never match.
          diff <(cd out-mk  && find . -name '*.html' | sort) \
               <(cd out-zen && find . -name '*.html' | sort)
          echo "html pages: $(find out-mk -name '*.html' | wc -l)"

      - name: The llms.txt surface must survive
        run: |
          set -euo pipefail
          # MEASURED 2026-09-16: zensical drops llms.txt, llms-full.txt and the
          # raw .md files, prints NOTHING about it, and exits 0. Until issue
          # #451 step 6 is decided, mkdocs remains the producer of those
          # endpoints and this asserts they are still produced.
          #
          # THIS IS A FLOOR, NOT A FINGERPRINT. It was `-eq 27` and broke the
          # moment a page was added (docs/architecture/core-boundary.md in
          # 055179e -> 28 found, expected 27, CI red for two commits). An exact
          # count turns "we added documentation" into a build failure, which
          # teaches contributors to delete the check rather than the page.
          #
          # `-lt` still catches what this exists to catch: zensical silently
          # dropping the raw .md surface would send the count toward zero, not
          # past the floor. Raise the floor when the doc set grows
          # substantially; lower it only when pages are removed on purpose, to the
          # new count.
          test -s out-mk/llms.txt
          test -s out-mk/llms-full.txt
          n=$(find out-mk -name '*.md' | wc -l)
          echo "raw .md endpoints: $n (floor 19)"
          [ "$n" -ge 19 ] || { echo "FAIL: expected at least 19 raw .md endpoints, found $n"; exit 1; }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: docs-build-comparison
          path: |
            out-mk
            out-zen
          retention-days: 3
          if-no-files-found: error
  # ---------------------------------------------------------------------------
  # gate — run the checks this repo WRITES but did not run
  # ---------------------------------------------------------------------------
  # Measured 2026-09-16: FOUR of the eleven checks in tool/gate.sh ran in a CI
  # job; SEVEN ran only on a developer's laptop — including the hosted-core
  # guard written the same day for the bug that broke the Pages build. A check
  # that runs nowhere is a check that is one forgotten `bash tool/gate.sh` away
  # from being decorative.
  #
  # NO `needs:` AND NO `if:` ON PURPOSE. This job must not be switchable off by
  # a paths filter: a PR that touches only docs can still break a workflow file
  # or a dependency ref, which is exactly what these three checks read.
  #
  # `dart analyze` and `dart format` are deliberately NOT duplicated here — the
  # `test` job already runs them.
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: 3.13.5
      - run: dart pub get
      - name: Resolve nested packages
        # check_page_versions.sh reads example/web's resolved core package.
        run: bash tool/resolve_packages.sh
      - name: Checks that otherwise run nowhere
        run: |
          set -uo pipefail
          RC=0; RAN=0
          run(){ RAN=$((RAN+1)); if "$@"; then echo "OK:   $*"; else echo "FAIL: $*"; RC=1; fi; }

          run bash tool/check_core_ref.sh
          run dart doc --validate-links .
          run bash tool/check_workflows_valid.sh
          # Every third-party `uses:` pinned to a 40-hex commit SHA.
          run bash tool/check_action_pins.sh
          # A read-only top-level `permissions:` in every workflow, and
          # `persist-credentials: false` on every checkout.
          run python3 -I tool/check_workflow_tokens.py
          run bash tool/check_pages_inputs.sh
          run bash tool/check_page_versions.sh
          # Not -I: the test imports tool/core_root.py beside it. The
          # Windows half is job tooling-windows.
          run python3 tool/core_root_test.py
          run bash tool/check_html_escaping.sh
          # ADDED 2026-09-17. tool/check_api_exercised.sh landed in 4b5c7b4
          # wired into tool/gate.sh ONLY, so a PR that broke it passed CI —
          # the check existed and CI never ran it. dart_monty_core has run its
          # copy in CI since the check was written; this was the asymmetry.
          run bash tool/check_api_exercised.sh
          # dart_monty_core's src/ is outside its semver, and the analyzer's
          # implementation_imports skips test/ and `export` (core#165).
          run bash tool/check_no_core_src_imports.sh
          # One Dart SDK across every workflow pin: dart format output differs
          # between SDK releases, so mismatched pins mean format wars.
          run bash tool/check_sdk_pin.sh

          # The counter catches a DELETED invocation line; it cannot catch a
          # missing script, because `run` increments before executing. The exit
          # code catches that one. Both are needed.
          [ "$RAN" -eq 12 ] || { echo "FAIL: expected 12 checks, ran $RAN"; RC=1; }
          echo "ran $RAN checks, rc=$RC"

          # REQUIRED, not decoration. Setting RC=1 in a variable and falling off
          # the end of the script exits 0 — a gate that prints FAIL: and reports
          # success. Same shape as the `continue-on-error: true` this repo
          # already had to delete from its format check.
          exit $RC
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docs: ${{ steps.filter.outputs.docs }}
    # paths-filter lists a pull request's files through the API.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            code:
              - 'lib/**'
              - 'test/**'
              - 'example/**'
              - 'hook/**'
              - 'tool/**'
              - 'pubspec.*'
              # dart_test.yaml DECIDES WHICH TESTS RUN, so leaving it out made
              # the five jobs gated on `code` skippable by the one edit most
              # able to disable them. A PR adding `skip:` to a tag changed no
              # listed path, so `code` was false, so test, test-integration,
              # test-examples, test-demo-pages and test-wasm were all skipped
              # and the run reported green. analysis_options.yaml is the same
              # shape for the analyzer. dart_monty_core's filter already lists
              # both; this one did not.
              - 'dart_test.yaml'
              - 'analysis_options.yaml'
              - '.github/**'
              - '!**.md'
            docs:
              - 'docs/**'
              - 'mkdocs.yml'
              - 'requirements-docs.lock'
              - 'requirements-zensical.txt'
              - '.github/workflows/ci.yaml'

  # ---------------------------------------------------------------------------
  # tooling-windows — the asset-path tooling on Windows
  # ---------------------------------------------------------------------------
  # example/web/run.sh, tool/test_python_ladder.sh and the Pages tooling find
  # dart_monty_core's assets through tool/core_root.py. On Windows a file URI's
  # bare path is `/C:/...`, which is not a usable path, and run.sh failed with
  # "could not locate dart_monty_core assets". No other job runs on Windows.
  # Needs no worker: it resolves packages and reads paths, nothing executes.
  tooling-windows:
    name: Asset-path tooling (Windows)
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-2025
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: 3.13.5
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Resolve example/web
        working-directory: example/web
        run: dart pub get
      - name: core_root unit tests
        run: python tool/core_root_test.py -v
      - name: example/web's core root holds the worker assets
        run: |
          root=$(python tool/core_root.py example/web/.dart_tool/package_config.json)
          echo "core root: $root"
          test -n "$root"
          test -f "$root/lib/assets/dart_monty_core_worker.js"
          test -f "$root/lib/assets/dart_monty_core_worker.wasm"

  markdown:
    name: Markdown lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - run: pip install pymarkdownlnt
      - name: pymarkdown scan
        run: >-
          pymarkdown
          --set extensions.front-matter.enabled=\$!True
          --disable-rules MD013,MD024,MD033,MD036,MD041,MD060
          scan docs/*.md

  test:
    name: Dart test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: 3.13.5
      - run: dart pub get
      # Core's hosted package build hook installs its prebuilt native worker.
      - name: Resolve nested packages
        # `dart pub get` above resolves the root and example/, but NOT
        # example/web/ — and `dart analyze` at the root analyses it anyway,
        # against no package_config. That is how this job failed with 21
        # unresolved-URI errors (run 35144138978's predecessor 35144134742)
        # while tool/gate.sh was green on a laptop whose tree still carried
        # example/web's resolution from an earlier run.
        run: bash tool/resolve_packages.sh
      - name: Analyze
        run: dart analyze --fatal-infos
      - name: dart format
        # `continue-on-error: true` was removed: it neutralised
        # --set-exit-if-changed, so this gate could never fail CI while
        # AGENTS.md documented it as a hard requirement.
        run: dart format --output=none --set-exit-if-changed lib/ test/ tool/
      - name: Test
        run: |
          # A SUITE THAT REGISTERS NOTHING PRINTS SUCCESS AND EXITS 0.
          # Never lower the floor to make a run pass.
          set -o pipefail
          dart test --coverage=coverage 2>&1 | tee /tmp/unit.log
          bash tool/assert_test_count.sh /tmp/unit.log 700 unit
      - name: Generate LCOV
        run: |
          # A hitmap must exist, or format_coverage emits an empty tracefile and
          # the gate below has nothing to measure. Fail at the cause.
          # RECURSIVE. `dart test --coverage=coverage` writes hitmaps NESTED, as
          # coverage/test/**/<name>.vm.json — never at the top level. A
          # `coverage/*.json` glob matches nothing even on a perfectly healthy
          # run, which is how the first version of this guard failed a green
          # build. Measured: 0 files at the top level, 1 recursively.
          # A suite whose tests were all skipped writes `{}` as its hitmap, and
          # coverage 1.16 (main's last run resolved 1.15.1) rejects that file
          # with a FormatException instead of ignoring it. Measured:
          # format_coverage 1.16.0 on a `{}` hitmap exits 255. An empty object
          # carries no coverage, so dropping it changes no number.
          find coverage -name '*.json' -size -3c | while read -r f; do
            if [ "$(cat "$f")" = '{}' ]; then rm -v "$f"; fi
          done
          if [ -z "$(find coverage -name '*.json' -print -quit 2>/dev/null)" ]; then
            echo 'FAIL: no coverage hitmap JSON under coverage/ — dart test'
            echo '  --coverage produced nothing to format.'
            exit 1
          fi
          # `dart run`, not `pub global activate`: activate resolves the latest
          # coverage package from pub.dev on every run, so the tool that
          # produces the number is unpinned while the number is gated.
          dart run coverage:format_coverage \
            --lcov --in=coverage --out=coverage/lcov.info --report-on=lib
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          flags: dart
      - name: Upload lcov artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: lcov-dart
          path: coverage/lcov.info
          # Does not close a hole — it stops a green step reporting an upload
          # of nothing, which is how a missing tracefile reaches the next job
          # looking like a present one.
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Integration tests — real dart_monty_core through its worker.
  # ---------------------------------------------------------------------------
  test-integration:
    name: Integration tests (real dart_monty_core worker)
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: 3.13.5
      - run: dart pub get
      # Core's hosted package build hook installs its prebuilt native worker.
      - name: Native workspace gates (root hook, real worker)
        run: |
          set -euo pipefail
          # The opt-in bundles the source-built mount library, including for AOT.
          mkdir -p build
          grep -q '^hooks:' pubspec.yaml && { echo 'pubspec already has hooks:' >&2; exit 1; }
          printf '\nhooks:\n  user_defines:\n    dart_monty_core:\n      build_worker: true\n' >> pubspec.yaml
          dart pub get
          set -o pipefail
          dart test -p vm --run-skipped \
            test/integration/native_workspace_driver_test.dart \
            test/integration/native_workspace_review_test.dart \
            test/integration/native_workspace_identity_test.dart \
            2>&1 | tee /tmp/native-workspace.log
          bash tool/assert_test_count.sh /tmp/native-workspace.log 86 native-workspace
          dart test -p vm --run-skipped \
            test/integration/native_workspace_policy_test.dart \
            2>&1 | tee /tmp/native-workspace-policy.log
          bash tool/assert_test_count.sh /tmp/native-workspace-policy.log 28 native-workspace-policy
      - name: Run the VM cell (integration and acceptance suites)
        # tool/test_cell.sh runs both suites and holds each to its floor in
        # tool/test_floors.tsv. --coverage feeds the integration LCOV below.
        run: |
          set -o pipefail
          bash tool/test_cell.sh vm --coverage=coverage-integration 2>&1 | tee /tmp/cell-vm.log
      - name: No worker process outlives the test runs
        run: |
          # A9 on the whole job: dispose and pool close leave no worker.
          # `-f` on the command line: Linux truncates process names to 15
          # characters, so `-x dart_monty_worker` would never match.
          set +e
          pgrep -a -f '(^|/)dart_monty_worker( |$)'
          rc=$?
          set -e
          case "$rc" in
            1) echo "PASS: no dart_monty_worker process is running" ;;
            0) echo "FAIL: dart_monty_worker processes are still running"; exit 1 ;;
            *) echo "FAIL: pgrep exited $rc, so nothing was checked"; exit 1 ;;
          esac
      # MOVED HERE FROM THE DELETED `test-examples` JOB. The run above already
      # executes these four tests (example_smoke_test.dart is tagged both
      # `integration` and `example`), so a whole job — checkout, SDK, cache,
      # a native build — existed to re-run them. This step keeps the EXACT
      # command and its floor of 4, which the integration floor (290 of ~314)
      # cannot express: losing one example would not move it. Sequential, in
      # this job's tree, so no second process republishes .dart_tool/lib while
      # the first has it mapped.
      - name: Run example smoke tests
        run: |
          # Floor 4, not 3: there are exactly four example/*.dart files and each
          # must smoke. With a suite this small a floor below the observed count
          # permits silently losing 25% of it. Deleting an example is therefore a
          # deliberate floor edit, which is the intent.
          set -o pipefail
          dart test test/integration/example_smoke_test.dart \
            -p vm --run-skipped --tags=example --reporter=expanded 2>&1 | tee /tmp/example.log
          bash tool/assert_test_count.sh /tmp/example.log 4 example
      - name: Generate integration LCOV
        run: |
          set -o pipefail
          # Same hitmap hazard as the unit job: format_coverage emits an empty
          # tracefile rather than failing when handed nothing, so refuse here
          # instead of uploading a file that silently lowers the merged number.
          # A suite whose tests were all skipped writes `{}` as its hitmap, and
          # coverage 1.16 (main's last run resolved 1.15.1) rejects that file
          # with a FormatException instead of ignoring it. Measured:
          # format_coverage 1.16.0 on a `{}` hitmap exits 255. An empty object
          # carries no coverage, so dropping it changes no number.
          find coverage-integration -name '*.json' -size -3c | while read -r f; do
            if [ "$(cat "$f")" = '{}' ]; then rm -v "$f"; fi
          done
          dart run coverage:format_coverage \
            --lcov --in=coverage-integration \
            --out=coverage-integration/lcov.info --report-on=lib
          if [ ! -s coverage-integration/lcov.info ]; then
            echo "FAIL: integration lcov is empty. Merging it would REMOVE"
            echo "  coverage from the patch gate rather than add it."
            exit 1
          fi
          echo "integration lcov lines: $(wc -l < coverage-integration/lcov.info)"
      - name: Upload integration coverage to Codecov
        # A SECOND FLAG, not a replacement. The unit job uploads with
        # `flags: dart`; Codecov combines reports across flags, so the project
        # figure becomes the union instead of the unit-only 82.19% it has been
        # reporting. Without this the patch gate below would judge on merged
        # coverage while the Codecov badge kept showing the smaller number —
        # two answers to the same question, which is worse than one wrong one.
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage-integration/lcov.info
          flags: integration
      - name: Upload integration lcov artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: lcov-integration
          path: coverage-integration/lcov.info

  # ---------------------------------------------------------------------------
  # test-demo-pages — every published demo must actually RUN
  # ---------------------------------------------------------------------------
  # Measured 2026-09-16 on integration/0.23, before this job existed:
  #
  #   example/*.dart            4   EXECUTED   (then test-examples; now a
  #                                 step in test-integration)
  #   example/web/bin/*.dart    7   COMPILED ONLY — test-examples ran
  #                                 `dart compile js` per file and threw the
  #                                 output away
  #   example/web/web/*.html    8   NOT EXERCISED AT ALL — no job loaded one
  #
  # Compiling is not running. A demo that compiles can still throw on load, 404
  # its own `.dart.js`, or fail to boot WASM — and async_matrix_demo.dart.js DID
  # 404 on the live site while async_matrix.html returned 200, with every check
  # green and the site stale since 2026-06-02. GitHub Pages hides a failed build
  # by serving the last good one, so the deploy can never be the thing that
  # catches this. This job assembles the site the way pages.yaml does, serves
  # it, and drives headless Chrome at every page.
  #
  # DEMO_PAGES_STRICT=1 — tool/check_demo_pages.sh exits 77 (a visible gate
  # skip) when no browser is installed, which is right for a laptop and wrong
  # here. ubuntu-latest ships Chrome, and the WASM/Chrome step in this job
  # already depends on that; if it ever stops being true this must go RED, not
  # quietly check nothing.
  test-demo-pages:
    name: Demo pages + WASM/Chrome tests (headless Chrome)
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: 3.13.5
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.x'
      # check_demo_pages.sh builds the documentation site with mkdocs.
      - run: pip install -r requirements-docs.lock
      - id: pubget
        run: dart pub get
      # Core's hosted package build hook installs its prebuilt native worker.
      - name: Web demos resolve hosted core, and there are 8 entrypoints
        working-directory: example/web
        run: |
          set -euo pipefail
          dart pub get
          python3 - <<'PYCORE'
          import pathlib, yaml
          lock = yaml.safe_load(pathlib.Path('pubspec.lock').read_text())
          core = lock['packages']['dart_monty_core']
          assert core['source'] == 'hosted', core
          assert core['version'].startswith('0.120.'), core
          PYCORE
          # COUNT, don't glob-and-trust. Deleting an entrypoint would otherwise
          # leave the site check green having compiled one fewer. A count in a
          # name asserts nothing; this does.
          n=0
          for f in bin/*.dart; do echo "--- $f"; n=$((n+1)); done
          echo "found $n entrypoint(s)"
          [ "$n" -eq 8 ] || { echo "FAIL: expected 8 web entrypoints, found $n."; \
            echo "  Adding one is fine — raise this number in the same commit."; \
            echo "  Losing one silently is the failure this catches."; exit 1; }

      - name: Every published page loads, boots, and resolves its assets
        env:
          DEMO_PAGES_STRICT: '1'
        run: bash tool/check_demo_pages.sh
      # MOVED HERE FROM THE DELETED `test-wasm` JOB, which paid a full setup
      # and a native-hook run (339 s on cold run 38155736475, although this
      # suite never loads the native lib) to run one command. Same command,
      # same floor of 8, sequential after the demo pages so no two `dart`
      # processes share this tree's .dart_tool. `!cancelled()` so a demo-page
      # failure does not hide this suite's own result.
      #
      # WASM / Chrome — dart_monty's open()/file-I/O + overlay handler logic must
      # compile to dart2js and run in a real browser, mirroring dart_monty_core's
      # WASM gate. The handlers run directly here (MemoryFileSystem, no dart:io and
      # no engine), so plain `dart test -p chrome` is the gate; the end-to-end
      # Python open() flow is covered by dart_monty_core's WASM fixture corpus.
      - name: Run WASM/Chrome tests (dart2js in headless Chrome)
        if: ${{ !cancelled() && steps.pubget.outcome == 'success' }}
        run: |
          # A SUITE THAT REGISTERS NOTHING PRINTS SUCCESS AND EXITS 0.
          # Floor calibrated from the green run 35065400002 (9 observed),
          # set below it so ordinary churn does not trip it. Raise the floor
          # when the suite grows; never lower it to make a run pass.
          set -o pipefail
          dart test -p chrome test/src/workspace/caps_test.dart \
            --reporter=expanded 2>&1 | tee /tmp/wasm.log
          bash tool/assert_test_count.sh /tmp/wasm.log 8 wasm
      - name: Upload the assembled site on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: demo-site
          # The compiled bundles are what a failure is usually about, so they
          # have to come back with the log rather than being rebuilt by hand.
          path: build/demo-site
          retention-days: 3
          if-no-files-found: error

  test-browser-cells:
    name: Browser cell ${{ matrix.cell }}
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        cell: [chrome-dart2js, chrome-dart2wasm, firefox-dart2js, firefox-dart2wasm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: 3.13.5
      - run: dart pub get
      # Integration and acceptance suites on a Web Worker from core's committed
      # assets. Each cell is held to its own floor in tool/test_floors.tsv.
      - name: Run the cell
        env:
          # package:test starts Firefox without -headless; the runner has no
          # display.
          MOZ_HEADLESS: '1'
        run: |
          set -o pipefail
          bash tool/test_cell.sh "${{ matrix.cell }}" 2>&1 | tee "/tmp/cell-${{ matrix.cell }}.log"

  coverage-merge:
    # RUNS ON PUSHES TOO, deliberately. The merge used to live inside
    # patch-coverage, which is `if: github.event_name == 'pull_request'`, so
    # `lcov --add-tracefile` was SKIPPED on every push and had never actually
    # executed — a step that has only ever been skipped is not a step that
    # passes. Splitting it out means each push exercises the real command and a
    # breakage surfaces on the commit that caused it rather than on somebody's
    # next pull request.
    #
    # Same shape as dart_monty_core's `coverage-merge` job, which is gated on
    # code changing rather than on the event being a PR.
    name: Coverage (merged unit + integration)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test, test-integration]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Download unit lcov artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: lcov-dart
          path: coverage
      - name: Download integration lcov artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: lcov-integration
          path: coverage-integration
      - name: Merge tracefiles
        run: |
          sudo apt-get update && sudo apt-get install -y lcov
          # REFUSE rather than degrade. Falling back to one tracefile would
          # silently restore the unit-only measurement this merge exists to
          # replace, and a gate that quietly measures less is the failure this
          # repo keeps finding.
          for f in coverage/lcov.info coverage-integration/lcov.info; do
            if [ ! -s "$f" ]; then
              echo "FAIL: $f is missing or empty. Merging without it would"
              echo "  judge that suite's lines as uncovered."
              exit 1
            fi
          done
          # `--ignore-errors unused` ONLY: `inconsistent` and `corrupt` are
          # lcov 2.x categories, and an unknown category is itself an error.
          lcov --add-tracefile coverage/lcov.info \
            --add-tracefile coverage-integration/lcov.info \
            --ignore-errors unused \
            -o merged.info
          if [ ! -s merged.info ]; then
            echo "FAIL: lcov produced an empty merged tracefile."
            exit 1
          fi
          # COVERED lines, not DA records. `grep -c '^DA:'` counts every
          # instrumented line whether hit or not, so all three tracefiles
          # report the SAME number by construction — measured on run
          # 35252740172, which printed "1898 / 1898 / 1898" and would have
          # printed it for a merge that did nothing at all. A diagnostic that
          # cannot distinguish success from failure is worse than none.
          #
          # `^DA:<line>,<hits>` with hits not starting 0 is a covered line.
          covered() { grep -cE '^DA:[0-9]+,[1-9]' "$1" || true; }
          u=$(covered coverage/lcov.info)
          i=$(covered coverage-integration/lcov.info)
          m=$(covered merged.info)
          echo "covered lines — unit: $u  integration: $i  merged: $m"
          if [ "$m" -lt "$u" ] || [ "$m" -lt "$i" ]; then
            echo "FAIL: the merge LOST coverage ($m < unit $u or integration $i)."
            echo "  A union cannot cover fewer lines than either input. This is"
            echo "  lcov misbehaving or the wrong operator, not a smaller number"
            echo "  to accept."
            exit 1
          fi
      - name: Upload merged lcov artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: lcov-merged
          path: merged.info

  patch-coverage:
    # NAMED FOR WHAT IT ENFORCES. This said "(70%)" while running
    # `--fail-under=50`, so every reader of a green tick was told a threshold
    # that was not applied. Raising 50 -> 70 is a policy change that can fail
    # real PRs and is left as a deliberate decision; renaming is free and makes
    # the claim true today.
    name: Patch coverage gate (50%)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [coverage-merge]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Install diff-cover
        run: pip install diff-cover
      - name: Download merged tracefile
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: lcov-merged
          path: coverage
      - name: Check patch coverage
        run: |
          sudo apt-get update && sudo apt-get install -y lcov
          # AN EMPTY TRACEFILE IS A FAILURE, NOT A SKIP.
          #
          # This read "skipping patch coverage gate; exit 0" — written when there
          # were no unit tests. There are now, and `-s` tests the file's
          # EMPTINESS, not its cause: it fires on any route to an empty
          # tracefile — --report-on matching nothing, a collector change, an
          # interrupted write — and every one of them silently turns this gate
          # into a no-op that reports success.
          #
          # Asserted rather than deleted: dropping the branch would leave the
          # contract to whatever `lcov --remove` happens to do with an empty
          # file, which is outsourcing a gate to a tool's incidental behaviour.
          # THE MERGED TRACEFILE, produced by the coverage-merge job.
          #
          # The merge used to happen HERE, and this job is
          # `if: github.event_name == 'pull_request'` — so `lcov
          # --add-tracefile` was skipped on every push and had never actually
          # run. It now lives in coverage-merge, which runs on pushes too, so
          # the command is exercised on the commit that changes it rather than
          # on somebody's next PR.
          if [ ! -s coverage/merged.info ]; then
            echo "FAIL: coverage/merged.info is missing or empty."
            echo "  The coverage-merge job produced nothing, so this gate would"
            echo "  verify nothing. That is a broken pipeline, not a pass."
            exit 1
          fi
          echo "merged tracefile: $(grep -c '^DA:' coverage/merged.info) DA records"
          lcov --remove coverage/merged.info \
            --ignore-errors unused \
            '*/generated/*' \
            -o filtered-coverage.info
          diff-cover filtered-coverage.info \
            --compare-branch=origin/${{ github.base_ref }} \
            --fail-under=50 \
            --diff-range-notation='..'
