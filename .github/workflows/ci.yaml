name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'feat/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'lib/**'
              - 'test/**'
              - 'example/**'
              - 'hook/**'
              - 'tool/**'
              - 'pubspec.*'
              - '.github/**'
              - '!**.md'

  markdown:
    name: Markdown lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pymarkdownlnt
      - name: pymarkdown scan
        run: >-
          pymarkdown
          --set extensions.front-matter.enabled=\$!True
          --disable-rules MD013,MD024,MD033,MD036,MD041,MD060
          scan docs/*.md

  test:
    name: Dart test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: pub-${{ runner.os }}-
      - run: dart pub get
      - name: Analyze
        run: dart analyze --fatal-infos
      - name: dart format
        run: dart format --set-exit-if-changed lib/ test/ tool/
      - name: Test
        run: dart test --coverage=coverage
      - name: Generate LCOV
        run: |
          dart pub global activate coverage
          dart pub global run coverage:format_coverage \
            --lcov --in=coverage --out=coverage/lcov.info --report-on=lib
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          flags: dart
      - name: Upload lcov artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lcov-dart
          path: coverage/lcov.info
          retention-days: 1

  patch-coverage:
    name: Patch coverage gate (70%)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install diff-cover
        run: pip install diff-cover
      - name: Download lcov artifact
        uses: actions/download-artifact@v4
        with:
          name: lcov-dart
          path: coverage
      - name: Check patch coverage
        run: |
          sudo apt-get update && sudo apt-get install -y lcov
          # Skip gate when tracefile is empty (no unit tests yet).
          if [ ! -s coverage/lcov.info ]; then
            echo "Coverage tracefile is empty — skipping patch coverage gate."
            exit 0
          fi
          lcov --remove coverage/lcov.info \
            --ignore-errors unused \
            '*/generated/*' \
            -o filtered-coverage.info
          diff-cover filtered-coverage.info \
            --compare-branch=origin/${{ github.base_ref }} \
            --fail-under=70 \
            --diff-range-notation='..'
