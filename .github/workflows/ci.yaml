name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'feat/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'lib/**'
              - 'test/**'
              - 'example/**'
              - 'hook/**'
              - 'tool/**'
              - 'pubspec.*'
              - '.github/**'
              - '!**.md'

  markdown:
    name: Markdown lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pymarkdownlnt
      - name: pymarkdown scan
        run: >-
          pymarkdown
          --set extensions.front-matter.enabled=\$!True
          --disable-rules MD013,MD024,MD033,MD036,MD041,MD060
          scan docs/*.md

  test:
    name: Dart test
    runs-on: ubuntu-latest
    # 30, not 15: dart_monty_core is a git dependency on this branch, so its
    # native asset is compiled from source rather than coming prebuilt from the
    # pub.dev archive. A cold cargo build of the ruff/ty crate tree does not fit
    # in 15 minutes.
    timeout-minutes: 30
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.11.4
      # Core's build hook shells out to cargo; without this every run pays a
      # full cold build of the ruff/ty crate tree.
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: pub-${{ runner.os }}-
      - run: dart pub get
      - name: Analyze
        run: dart analyze --fatal-infos
      - name: dart format
        # `continue-on-error: true` was removed: it neutralised
        # --set-exit-if-changed, so this gate could never fail CI while
        # AGENTS.md documented it as a hard requirement.
        run: dart format --output=none --set-exit-if-changed lib/ test/ tool/
      - name: Test
        run: dart test --coverage=coverage
      - name: Generate LCOV
        run: |
          dart pub global activate coverage
          dart pub global run coverage:format_coverage \
            --lcov --in=coverage --out=coverage/lcov.info --report-on=lib
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          flags: dart
      - name: Upload lcov artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lcov-dart
          path: coverage/lcov.info
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Example smoke tests — every example/*.dart must compile and exit 0.
  # Installs Rust so dart_monty_core's native-asset hook can compile the dylib.
  # ---------------------------------------------------------------------------
  test-examples:
    name: Example smoke tests
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.11.4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: pub-${{ runner.os }}-
      - run: dart pub get
      - name: Run example smoke tests
        run: |
          dart test test/integration/example_smoke_test.dart \
            -p vm --run-skipped --tags=example --reporter=expanded

  # ---------------------------------------------------------------------------
  # WASM / Chrome — dart_monty's open()/file-I/O + overlay handler logic must
  # compile to dart2js and run in a real browser, mirroring dart_monty_core's
  # WASM gate. The handlers run directly here (MemoryFileSystem, no dart:io and
  # no engine), so plain `dart test -p chrome` is the gate; the end-to-end
  # Python open() flow is covered by dart_monty_core's WASM fixture corpus.
  # ---------------------------------------------------------------------------
  test-wasm:
    name: WASM/Chrome tests
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # See the `test` job: the git dependency means cargo builds core from
    # source, which does not fit in 15 minutes cold.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.11.4
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: pub-${{ runner.os }}-
      - run: dart pub get
      - name: Run WASM/Chrome tests (dart2js in headless Chrome)
        run: dart test -p chrome test/experiments/*_wasm_test.dart --reporter=expanded

  patch-coverage:
    name: Patch coverage gate (70%)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install diff-cover
        run: pip install diff-cover
      - name: Download lcov artifact
        uses: actions/download-artifact@v4
        with:
          name: lcov-dart
          path: coverage
      - name: Check patch coverage
        run: |
          sudo apt-get update && sudo apt-get install -y lcov
          # Skip gate when tracefile is empty (no unit tests yet).
          if [ ! -s coverage/lcov.info ]; then
            echo "Coverage tracefile is empty — skipping patch coverage gate."
            exit 0
          fi
          lcov --remove coverage/lcov.info \
            --ignore-errors unused \
            '*/generated/*' \
            -o filtered-coverage.info
          diff-cover filtered-coverage.info \
            --compare-branch=origin/${{ github.base_ref }} \
            --fail-under=50 \
            --diff-range-notation='..'
