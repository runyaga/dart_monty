name: DCM

on:
  push:
    branches: [main]
    paths:
      - 'lib/**/*.dart'
      - 'test/**/*.dart'
      - 'dcm_options.yaml'
      - 'analysis_options.yaml'
  pull_request:
  # No `branches:` filter — a PR gets CI whatever it targets.
  #
  # This previously read `branches: [main, 'feat/**']`, which silently gave
  # ZERO test jobs to any PR based on another branch. #441 merged having run
  # only `label` and `trufflehog`: its "CLEAN / mergeable" status was not
  # evidence of anything. Stacked PRs are normal here, so enumerating prefixes
  # would just move the gap; not filtering closes it.
    paths:
      - 'lib/**/*.dart'
      - 'test/**/*.dart'
      - 'dcm_options.yaml'
      - 'analysis_options.yaml'
  workflow_dispatch:

concurrency:
  group: dcm-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dcm:
    name: DCM Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - uses: CQLabs/setup-dcm@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Ratchet, not a clean run. `dcm analyze lib` has 9 pre-existing issues, so a
      # zero-issue gate could never go green -- which is why this step carried
      # continue-on-error and could not fail at all. The ratchet fails on any NEW
      # issue above tool/dcm-baseline.json and is therefore both blocking and
      # satisfiable. Regenerate deliberately: bash tool/dcm_ratchet.sh --update
      - name: DCM ratchet (blocking)
        run: bash tool/dcm_ratchet.sh
        env:
          DCM_CI_KEY: ${{ secrets.DCM_CI_KEY }}
          DCM_EMAIL: ${{ secrets.DCM_EMAIL }}

      # Labelled "(blocking)" but carried continue-on-error, i.e. it was advisory
      # and said otherwise. It genuinely fails today (exit 2) on pre-existing
      # debt: methods of 84/82/66/58 lines against a 50 threshold, cyclomatic
      # complexity 13 against 10, and two classes with 17 methods against 15.
      # Making it truly blocking means paying that down first, so for now the
      # label matches the behaviour. Ratcheting it the way dcm analyze is
      # ratcheted is the obvious follow-up.
      - name: DCM metrics (advisory)
        if: always()
        continue-on-error: true
        run: >-
          dcm calculate-metrics lib
          --fatal-level=high
          --exclude="{lib/src/wasm/**,lib/src/platform/testing/**,lib/src/repl/testing/**}"
          --ci-key=${{ secrets.DCM_CI_KEY }}
          --email=${{ secrets.DCM_EMAIL }}

      - name: DCM check-unused-code (advisory)
        if: always()
        continue-on-error: true  # advisory by design (matches tool/gate.sh)
        run: >-
          dcm check-unused-code lib
          --ci-key=${{ secrets.DCM_CI_KEY }}
          --email=${{ secrets.DCM_EMAIL }}

      - name: DCM check-parameters (advisory)
        if: always()
        continue-on-error: true  # advisory by design (matches tool/gate.sh)
        run: >-
          dcm check-parameters lib
          --ci-key=${{ secrets.DCM_CI_KEY }}
          --email=${{ secrets.DCM_EMAIL }}

      - name: Upload to DCM dashboard
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: >-
          dcm run lib
          --all
          --upload
          --project=${{ secrets.DCM_PROJECT_KEY }}
          --ci-key=${{ secrets.DCM_CI_KEY }}
          --email=${{ secrets.DCM_EMAIL }}
