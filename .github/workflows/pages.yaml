name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # ── Build WASM binary (Rust → wasm32-wasip1) ─────────────────────
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - name: Build WASM
        working-directory: native
        run: cargo build --release --target wasm32-wasip1

      # ── Build JS bridge ──────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify WASM binary
        run: |
          test -f native/target/wasm32-wasip1/release/dart_monty_native.wasm

      # ── Compile Dart to JS ───────────────────────────────────────────
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Cache Pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-
      - name: Install Dart dependencies
        working-directory: example/web
        run: dart pub get
      - name: Compile main.dart
        working-directory: example/web
        run: dart compile js bin/main.dart -o web/main.dart.js
      - name: Compile ladder_showcase.dart
        working-directory: example/web
        run: dart compile js bin/ladder_showcase.dart -o web/ladder_showcase.dart.js
      - name: Compile visualizer.dart
        working-directory: example/web
        run: dart compile js bin/visualizer.dart -o web/visualizer.dart.js

      # ── Assemble site ────────────────────────────────────────────────
      - name: Copy WASM binary
        run: |
          cp native/target/wasm32-wasip1/release/dart_monty_native.wasm example/web/web/
      - name: Copy fixture files
        run: |
          mkdir -p example/web/web/fixtures
          cp test/fixtures/python_ladder/tier_*.json example/web/web/fixtures/
      - name: Copy site images
        run: |
          cp docs/dart_monty.jpg example/web/web/

      # ── Stamp build date ─────────────────────────────────────────────
      - name: Stamp build date into HTML
        run: |
          stamp="$(date -u +'%Y-%m-%d %H:%M UTC')"
          sed -i "s/__BUILD_DATE__/$stamp/g" example/web/web/index.html
          sed -i "s/__BUILD_DATE__/$stamp/g" example/web/web/mcp-docs.html

      # ── Deploy ───────────────────────────────────────────────────────
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: example/web/web
      - id: deploy
        uses: actions/deploy-pages@v4
