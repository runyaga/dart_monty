name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # ── Checkout dart_monty_core for WASM build + JS bridge ──────────
      - uses: actions/checkout@v4
        with:
          repository: runyaga/dart_monty_core
          ref: main
          path: dart_monty_core

      # ── Build WASM binary (Rust → wasm32-wasip1) ─────────────────────
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: dart_monty_core/native
      - name: Build WASM
        working-directory: dart_monty_core/native
        run: cargo build --release --target wasm32-wasip1

      # ── Build JS bridge ──────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build JS bridge and worker
        working-directory: dart_monty_core/js
        run: |
          npm install --force
          node build.js
      - name: Copy JS bridge assets to example
        run: |
          cp dart_monty_core/assets/dart_monty_bridge.js example/web/web/
          cp dart_monty_core/assets/dart_monty_worker.js example/web/web/

      # ── Compile Dart to JS ───────────────────────────────────────────
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Cache Pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-
      - name: Install Dart dependencies
        working-directory: example/web
        run: dart pub get
      - name: Compile main.dart
        working-directory: example/web
        run: dart compile js bin/main.dart -o web/main.dart.js
      - name: Compile ladder_showcase.dart
        working-directory: example/web
        run: dart compile js bin/ladder_showcase.dart -o web/ladder_showcase.dart.js
      - name: Compile visualizer.dart
        working-directory: example/web
        run: dart compile js bin/visualizer.dart -o web/visualizer.dart.js
      - name: Compile vfs_demo.dart
        working-directory: example/web
        run: dart compile js bin/vfs_demo.dart -o web/vfs_demo.dart.js
      - name: Compile agent_demo.dart
        working-directory: example/web
        run: dart compile js bin/agent_demo.dart -o web/agent_demo.dart.js
      - name: Compile repl_demo.dart
        working-directory: example/web
        run: dart compile js bin/repl_demo.dart -o web/repl_demo.dart.js

      # ── Build MkDocs ────────────────────────────────────────────────
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install MkDocs dependencies
        run: pip install mkdocs-material
      - name: Build documentation
        run: mkdocs build
      # ── Assemble site ────────────────────────────────────────────────
      - name: Copy live demo assets to site root
        run: |
          cp -r example/web/web/* site/
          cp dart_monty_core/assets/dart_monty_native.wasm site/
          mkdir -p site/fixtures
          cp test/fixtures/python_ladder/tier_*.json site/fixtures/
          mkdir -p site/assets
          cp -r docs/assets/* site/assets/

      # ── Stamp build date ─────────────────────────────────────────────
      - name: Stamp build date into HTML
        run: |
          stamp="$(date -u +'%Y-%m-%d %H:%M UTC')"
          sed -i "s/__BUILD_DATE__/$stamp/g" site/index.html

      # ── Deploy ───────────────────────────────────────────────────────
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
