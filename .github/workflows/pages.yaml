name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # ── Checkout dart_monty_core for its committed assets ─────────────
      # Assets live in dart_monty_core/lib/assets/ (under lib/ so Flutter
      # can resolve them via packages/dart_monty_core/...). Committed to
      # git (Mode A). No cargo/node build step is required — just check
      # out the repo and copy the files.
      - uses: actions/checkout@v4
        with:
          repository: runyaga/dart_monty_core
          # MUST MATCH pubspec.yaml, example/pubspec.yaml and
          # example/web/pubspec.yaml; tool/check_core_ref.sh fails the gate if
          # the four disagree.
          #
          # This said `main`, which is 315 commits behind integration/0.23 and
          # has ZERO occurrences of `asStringMap` — so the Pages build compiled
          # the demos against a core that cannot satisfy this package. Pages
          # serves the LAST GOOD BUILD when a build fails, so that presented as
          # a stale site rather than a red build.
          ref: integration/0.23
          path: dart_monty_core

      # ── Compile Dart to JS ───────────────────────────────────────────
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.11.4
      - name: Cache Pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-
      - name: Install Dart dependencies
        working-directory: example/web
        run: dart pub get
      - name: Compile main.dart
        working-directory: example/web
        run: dart compile js bin/main.dart -o web/main.dart.js
      - name: Compile ladder_showcase.dart
        working-directory: example/web
        run: dart compile js bin/ladder_showcase.dart -o web/ladder_showcase.dart.js
      - name: Compile visualizer.dart
        working-directory: example/web
        run: dart compile js bin/visualizer.dart -o web/visualizer.dart.js
      - name: Compile vfs_demo.dart
        working-directory: example/web
        run: dart compile js bin/vfs_demo.dart -o web/vfs_demo.dart.js
      - name: Compile agent_demo.dart
        working-directory: example/web
        run: dart compile js bin/agent_demo.dart -o web/agent_demo.dart.js
      - name: Compile repl_demo.dart
        working-directory: example/web
        run: dart compile js bin/repl_demo.dart -o web/repl_demo.dart.js
      # MISSING UNTIL NOW, and the site has been serving a 404 for it.
      # async_matrix.html and index.html both <script src="async_matrix_demo.dart.js">,
      # this workflow compiled six of the seven entrypoints, and every .dart.js is
      # gitignored — so nothing filled the gap on a fresh checkout. Verified live:
      #   main.dart.js 200, repl_demo.dart.js 200, visualizer.dart.js 200,
      #   async_matrix_demo.dart.js 404, while async_matrix.html itself was 200.
      - name: Compile async_matrix_demo.dart
        working-directory: example/web
        run: dart compile js bin/async_matrix_demo.dart -o web/async_matrix_demo.dart.js

      # ── Build MkDocs ────────────────────────────────────────────────
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install MkDocs dependencies
        run: pip install -r requirements-docs.txt
      - name: Build documentation
        run: mkdocs build
      # ── Assemble site ────────────────────────────────────────────────
      - name: Copy live demo assets to site root
        run: |
          cp -r example/web/web/* site/
          cp dart_monty_core/lib/assets/* site/
          mkdir -p site/fixtures
          cp test/fixtures/python_ladder/tier_*.json site/fixtures/
          mkdir -p site/assets
          cp -r docs/assets/* site/assets/

      # A "Stamp build date into HTML" step lived here and did NOTHING.
      #
      #     sed -i "s/__BUILD_DATE__/$stamp/g" site/index.html
      #
      # `__BUILD_DATE__` appeared in this workflow and NOWHERE ELSE in the
      # repository — not in docs/, not in any template. Confirmed against the
      # live site: neither a literal placeholder nor a rendered date appears in
      # the 16,298 bytes it serves. The sed matched nothing, exited 0, and
      # reported success on every deploy.
      #
      # Removed rather than repaired. Deleting a step that has never had an
      # observable effect changes nothing; ADDING the placeholder would put a
      # new user-visible element on the site, which is a product decision and
      # not one to smuggle in as a bug fix. If a build date is wanted, add it
      # deliberately — tool/check_pages_inputs.sh will then hold the placeholder
      # and the sed together.

      # ── Deploy ───────────────────────────────────────────────────────
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
