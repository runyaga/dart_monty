name: Prepare release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 0.2.0)'
        required: true
        type: string
      publish:
        description: 'Publish to pub.dev and create tag'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

jobs:
  validate:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Generate FFI bindings
        run: bash tool/generate_bindings.sh

      - name: Analyze package
        run: |
          dart pub get
          dart analyze --fatal-infos

      - name: Run tests
        run: |
          dart pub get
          dart test

  build-native:
    name: Build native (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x64
            src: native/target/release/libdart_monty_native.so
            dst: vendored/native-linux-x64/libdart_monty_native.so
          - os: ubuntu-latest
            label: linux-arm64
            target: aarch64-unknown-linux-gnu
            src: native/target/aarch64-unknown-linux-gnu/release/libdart_monty_native.so
            dst: vendored/native-linux-arm64/libdart_monty_native.so
            cross: true
          - os: macos-13
            label: macos-x64
            src: native/target/release/libdart_monty_native.dylib
            dst: vendored/native-macos-x64/libdart_monty_native.dylib
          - os: macos-14
            label: macos-arm64
            src: native/target/release/libdart_monty_native.dylib
            dst: vendored/native-macos-arm64/libdart_monty_native.dylib
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Install cross-compilation toolchain
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build and test Rust
        working-directory: native
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          PYO3_CROSS_PYTHON_VERSION: '3.12'
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            cargo build --release --target "${{ matrix.target }}"
          else
            cargo build --release
            cargo test
          fi
          cargo fmt --check
          cargo clippy ${{ matrix.target && format('--target {0}', matrix.target) || '' }} -- -D warnings

      - name: Fix macOS install_name
        if: runner.os == 'macOS'
        run: |
          install_name_tool -id @rpath/libdart_monty_native.dylib "${{ matrix.src }}"
          echo "install_name after fix:"
          otool -D "${{ matrix.src }}"

      - name: Copy binary to destination
        run: |
          mkdir -p "$(dirname "${{ matrix.dst }}")"
          cp "${{ matrix.src }}" "${{ matrix.dst }}"
          ls -lh "${{ matrix.dst }}"

      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.label }}
          path: ${{ matrix.dst }}

  release:
    name: Stamp, publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [validate, build-native]
    environment: pub-dev
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Download vendored binaries
        uses: actions/download-artifact@v4
        with:
          path: vendored

      - name: Place vendored binaries
        run: |
          # Binaries are already downloaded into vendored/ by download-artifact
          ls -lhR vendored/

      - name: Bump version in pubspec
        run: |
          VERSION="${{ inputs.version }}"
          sed -i "s/^version: .*/version: ${VERSION}/" pubspec.yaml

      - name: Stamp CHANGELOGs
        run: bash tool/stamp_changelogs.sh "${{ inputs.version }}"

      - name: Verify CHANGELOG entry
        run: |
          VERSION="${{ inputs.version }}"
          if ! grep -q "## ${VERSION}" CHANGELOG.md; then
            echo "ERROR: CHANGELOG.md missing entry for ${VERSION}"
            exit 1
          fi

      - name: Generate FFI bindings
        run: bash tool/generate_bindings.sh

      - name: Check dartdoc
        run: |
          dart pub get
          dart doc --dry-run

      - name: Commit version bumps
        run: |
          VERSION="${{ inputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: bump version to ${VERSION}"

      - name: Dry-run publish
        run: bash tool/publish.sh

      - name: Tag and push
        if: inputs.publish
        run: |
          VERSION="${{ inputs.version }}"
          git tag "v${VERSION}"
          git push origin HEAD:main
          git push origin "v${VERSION}"

      - name: Publish to pub.dev
        if: inputs.publish
        run: bash tool/publish.sh --publish

      - name: Verify pub.dev publication
        if: inputs.publish
        run: |
          echo "Waiting 60s for pub.dev indexing..."
          sleep 60
          bash tool/verify_publish.sh "${{ inputs.version }}"
