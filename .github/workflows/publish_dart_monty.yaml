name: Publish dart_monty

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  id-token: write

jobs:
  publish:
    name: Publish to pub.dev
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          # PINNED. This is the PUBLISH path: whatever SDK runs here decides what
          # is uploaded to pub.dev, and `stable` silently changes under us on
          # every Dart release. Every other job in this repo already pins
          # the same SDK; publishing was the one that did not.
          sdk: 3.13.5
      - run: dart pub get
      - name: Analyze
        run: dart analyze --fatal-infos
      - name: Test
        run: dart test
      - name: Dry run
        run: dart pub publish --dry-run
      - name: Publish
        run: dart pub publish --force
