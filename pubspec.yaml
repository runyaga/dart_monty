name: dart_monty
description: Script your Dart/Flutter app with sandboxed Python — runtime extensions, Flutter glue, and FFI/WASM asset loading on top of dart_monty_core.
version: 0.17.0
homepage: https://github.com/runyaga/dart_monty
repository: https://github.com/runyaga/dart_monty
issue_tracker: https://github.com/runyaga/dart_monty/issues
topics:
  - python
  - sandbox
  - interpreter
  - dart

environment:
  sdk: ^3.10.0

dependencies:
  collection: ^1.18.0
  dart_monty_core: ^0.17.0
  dinja: ^1.0.0
  file: ^7.0.0
  meta: ^1.11.0
  path: ^1.8.0
  signals_core: ^6.2.0
  struct_log: ^0.3.0
  test: ^1.25.0
  # Used by DartMonty.ensureInitialized() on web for dynamic <script>
  # injection of the dart_monty_core bridge. No-op on native targets.
  web: ^1.1.0

dev_dependencies:
  very_good_analysis: ^10.0.0

# Pointing at dart_monty_core PR #102 (feat/futures-driveloop-and-matrix)
# which:
#   1. promotes `ReplPlatform` to implement `MontyFutureCapable` (via PR #101
#      that #102 stacks on), so `useFutures: true` here actually engages the
#      bridge's futures dispatch path
#   2. wires `_driveLoop`'s MontyResolveFutures case so Monty.run /
#      MontyRepl.feedRun work too
# Pinned to the SHA so the override stays stable through branch deletion.
# Drop and bump dart_monty_core: ^0.x.y once #102 lands and a release ships.
dependency_overrides:
  dart_monty_core:
    git:
      url: https://github.com/runyaga/dart_monty_core.git
      ref: 458b01e2b8b6c8457ff1e0ee00c90514b2e6fc64
