name: dart_monty
description: Script your Dart/Flutter app with sandboxed Python — runtime extensions, Flutter glue, and FFI/WASM asset loading on top of dart_monty_core.
version: 0.18.0
homepage: https://github.com/runyaga/dart_monty
repository: https://github.com/runyaga/dart_monty
issue_tracker: https://github.com/runyaga/dart_monty/issues
topics:
  - python
  - sandbox
  - interpreter
  - dart

environment:
  sdk: ^3.10.0

dependencies:
  collection: ^1.18.0
  # 0.19 integration branch: dart_monty_core 0.19.0 is NOT published, so CI
  # cannot resolve it from pub.dev. Track the branch directly so PRs against
  # this line get real CI against the code they target.
  #
  # Revert to `dart_monty_core: ^0.19.0` before merging to main — a git
  # dependency cannot be published to pub.dev.
  dart_monty_core:
    git:
      url: https://github.com/runyaga/dart_monty_core.git
      ref: feat/monty-019-p1a
  dinja: ^1.0.0
  file: ^7.0.0
  meta: ^1.11.0
  path: ^1.8.0
  signals_core: ^6.2.0
  struct_log: ^0.3.0
  test: ^1.25.0
  # Used by DartMonty.ensureInitialized() on web for dynamic <script>
  # injection of the dart_monty_core bridge. No-op on native targets.
  web: ^1.1.0

dev_dependencies:
  very_good_analysis: ^10.0.0
