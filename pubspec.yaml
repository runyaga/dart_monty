name: dart_monty
description: Script your Dart/Flutter app with sandboxed Python — runtime extensions, Flutter glue, and FFI/WASM asset loading on top of dart_monty_core.
version: 0.17.0
homepage: https://github.com/runyaga/dart_monty
repository: https://github.com/runyaga/dart_monty
issue_tracker: https://github.com/runyaga/dart_monty/issues
topics:
  - python
  - sandbox
  - interpreter
  - dart

environment:
  sdk: ^3.10.0

dependencies:
  collection: ^1.18.0
  dart_monty_core: ^0.17.0
  dinja: ^1.0.0
  file: ^7.0.0
  meta: ^1.11.0
  path: ^1.8.0
  signals_core: ^6.2.0
  struct_log: ^0.3.0
  test: ^1.25.0
  # Used by DartMonty.ensureInitialized() on web for dynamic <script>
  # injection of the dart_monty_core bridge. No-op on native targets.
  web: ^1.1.0

dev_dependencies:
  very_good_analysis: ^10.0.0

# dart_monty_core 0.17.0 (pub.dev) predates the inputs/MontyInternalError/
# MontyNone work merged in dart_monty_core#99. Point at main until the next
# core release. dependency_overrides apply to this repo's builds only —
# downstream consumers still see the pub.dev `^0.17.0` constraint above.
dependency_overrides:
  dart_monty_core:
    git:
      url: https://github.com/runyaga/dart_monty_core.git
      ref: main
