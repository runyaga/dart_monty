name: dart_monty
description: Script your Dart/Flutter app with sandboxed Python — runtime extensions, Flutter glue, and FFI/WASM asset loading on top of dart_monty_core.
version: 0.120.1
homepage: https://github.com/runyaga/dart_monty
repository: https://github.com/runyaga/dart_monty
issue_tracker: https://github.com/runyaga/dart_monty/issues
topics:
  - python
  - sandbox
  - interpreter
  - dart

environment:
  sdk: ^3.10.0

dependencies:
  dart_monty_core: ^0.120.1
  meta: ^1.11.0
  path: ^1.8.0
  signals_core: ^6.2.0
  struct_log: ^0.3.0

dev_dependencies:
  analyzer: ^14.5.0
  # `collection` and `test` are dev dependencies so that consumers do not pull
  # the test framework into their own dependency graph. Nothing under lib/
  # imports either. `collection` has a single user,
  # test/integration/demo_page_boot_test.dart.
  collection: ^1.18.0
  # Declared, not `pub global activate`d: activate resolves the latest
  # coverage package from pub.dev on every CI run, which leaves the tool
  # that PRODUCES the coverage number unpinned while the number is gated.
  #
  # `dcm check-dependencies` reports this as "coverage is not used" and that
  # is a FALSE POSITIVE, kept rather than silenced: it is used as a BINARY,
  # `dart run coverage:format_coverage` (.github/workflows/ci.yaml:275), not
  # as a Dart import, so there is nothing for a source scan to find.
  coverage: ^1.15.0
  test: ^1.25.0
  very_good_analysis: ^10.0.0
