name: dart_monty
description: Script your Dart/Flutter app with sandboxed Python — runtime extensions, Flutter glue, and FFI/WASM asset loading on top of dart_monty_core.
version: 0.18.0
homepage: https://github.com/runyaga/dart_monty
repository: https://github.com/runyaga/dart_monty
issue_tracker: https://github.com/runyaga/dart_monty/issues
topics:
  - python
  - sandbox
  - interpreter
  - dart

environment:
  sdk: ^3.10.0

dependencies:
  collection: ^1.18.0
  dart_monty_core: ^0.18.1
  dinja: ^1.0.0
  file: ^7.0.0
  meta: ^1.11.0
  path: ^1.8.0
  signals_core: ^6.2.0
  struct_log: ^0.3.0
  test: ^1.25.0
  # Used by DartMonty.ensureInitialized() on web for dynamic <script>
  # injection of the dart_monty_core bridge. No-op on native targets.
  web: ^1.1.0

dev_dependencies:
  very_good_analysis: ^10.0.0

# 0.19 integration branch ONLY. dart_monty_core 0.19.0 is not published, so CI
# would otherwise resolve ^0.18.1 and test this line against a dependency it
# does not target.
#
# This is a `dependency_overrides` and NOT a `dependencies` entry on purpose:
# `dart analyze --fatal-infos` rejects a git dependency in a publishable
# package (`invalid_dependency`), and overrides are ignored on publish.
#
# DELETE THIS BLOCK before merging to main or releasing, and move the
# `dart_monty_core` constraint above to ^0.19.0.
dependency_overrides:
  dart_monty_core:
    git:
      url: https://github.com/runyaga/dart_monty_core.git
      ref: feat/monty-019-p1a
