site_name: dart_monty
site_description: Pure Dart bindings for Monty, a restricted sandboxed Python interpreter built in Rust.
theme:
  name: material
  palette:
    primary: indigo
    accent: indigo
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy

nav:
  - Overview: help.md
  - User Guide:
      - Installation: user/install.md
      - REPL: user/repl.md
      - Plugins: user/plugins.md
      - API Reference: user/api-reference.md
      - Host Functions:
          - Introduction: user/host-functions-intro.md
          - Beginner: user/host-functions-beginner.md
          - Intermediate: user/host-functions-intermediate.md
          - Advanced: user/host-functions-advanced.md
      - Bridge Middleware: user/bridge-middleware.md
  - Architecture:
      - Overview: architecture/overview.md
      - Error Hierarchy: architecture/error-hierarchy.md
      - Lifecycles: architecture/lifecycles.md
      - OsCall / VFS: architecture/oscall-vfs.md
      - Plugin System: architecture/plugin-system.md
      - Sandbox Architecture: architecture/sandbox-architecture.md
  - Live Demo:
      - Introduction: index.html
      - The Altar of Dart: showcase.html
      - Stateful REPL: repl.html
      - VFS / Filesystem: vfs.html
      - Agent Interaction: agent.html
      - Execution Visualizer: visualizer.html
      - Python Ladder: ladder.html
  - Contributing:
      - Native Build: contributor/native-build.md
