site_name: dart_monty
site_description: Pure Dart bindings for Monty, a restricted sandboxed Python interpreter built in Rust.
theme:
  name: material
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy
use_directory_urls: false

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - extra.css

# Generates llms.txt + llms-full.txt at site root from the nav/sections
# below. Install: pip install -r requirements-docs.txt
plugins:
  - search
  - llmstxt:
      markdown_description: |
        High-level Dart/Flutter bindings for sandboxed Python scripting.
        Builds on dart_monty_core (the low-level FFI/WASM glue) with a
        runtime, extension API (Jinja, MessageBus, Sandbox), Flutter web
        bridge auto-loading, OS-call composition, and host-function
        dispatch with typed schemas.

        IMPORTANT: Monty does NOT support `class`, decorators (`@foo`),
        generators (`yield`), `match`/`case`, `del`, or arbitrary
        imports. Use dicts + module-level functions in place of classes.
        Stdlib: `math`, `re`, `json`, `datetime`, `pathlib`.

        Run `Monty.typeCheck(code)` before `runtime.execute(code)` to
        catch subset violations as typed errors before runtime — the
        supported development loop.
      full_output: llms-full.txt
      sections:
        Overview:
          - index.md
          - landing.md
        User Guide:
          - user/install.md
          - user/deployment.md
          - user/repl.md
          - user/extensions.md
          - user/api-reference.md
        Tutorials:
          - tutorials/host-functions-intro.md
          - tutorials/host-functions-beginner.md
          - tutorials/host-functions-intermediate.md
          - tutorials/host-functions-advanced.md
          - tutorials/bridge-middleware.md
          - tutorials/llm-prompt-rules.md
        Deep Dives:
          - architecture/overview.md
          - deep-dives/sandbox-architecture.md
          - deep-dives/oscall-vfs.md
          - deep-dives/error-hierarchy.md
          - deep-dives/extension-system.md
          - deep-dives/bridge-concurrency.md
        Technical Reference:
          - reference/native-crate.md
          - reference/monty-rust-api.md
          - reference/ffi-handle-lifecycle.md
          - reference/bridge-integration.md
          - reference/internals.md
          - reference/api-coverage-plan.md
        Contributing:
          - contributor/setup.md
          - contributor/testing.md

nav:
  - Overview: index.md
  - User Guide:
      - Installation: user/install.md
      - Deployment: user/deployment.md
      - REPL: user/repl.md
      - Extensions: user/extensions.md
      - API Reference: user/api-reference.md
  - Tutorials:
      - Host Functions Intro: tutorials/host-functions-intro.md
      - Host Functions Beginner: tutorials/host-functions-beginner.md
      - Host Functions Intermediate: tutorials/host-functions-intermediate.md
      - Host Functions Advanced: tutorials/host-functions-advanced.md
      - Bridge Middleware: tutorials/bridge-middleware.md
      - LLM Prompt Rules: tutorials/llm-prompt-rules.md
  - Deep Dives:
      - Architecture Overview: architecture/overview.md
      - Sandbox Architecture: deep-dives/sandbox-architecture.md
      - OsCall / VFS Layer: deep-dives/oscall-vfs.md
      - Error Hierarchy: deep-dives/error-hierarchy.md
      - Extension System: deep-dives/extension-system.md
      - Bridge Concurrency: deep-dives/bridge-concurrency.md
  - Technical Reference:
      - Native Crate (Rust): reference/native-crate.md
      - Monty Rust API: reference/monty-rust-api.md
      - FFI Handle Lifecycle: reference/ffi-handle-lifecycle.md
      - Bridge Integration: reference/bridge-integration.md
      - Internals: reference/internals.md
      - API Coverage Plan: reference/api-coverage-plan.md
  - Contributing:
      - Development Setup: contributor/setup.md
      - Testing: contributor/testing.md

